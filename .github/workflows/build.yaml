name: Build and test

on:
  push:
    branches: ["feature/setup-project-structure"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openex_test
          POSTGRES_USER: openex
          POSTGRES_PASSWORD: openex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openex -d openex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Get project files
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/openex_test
          SPRING_DATASOURCE_USERNAME: openex
          SPRING_DATASOURCE_PASSWORD: openex