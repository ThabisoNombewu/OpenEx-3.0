spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: none

  session:
    store-type: none

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

logging:
  level:
    com.openex.backend: DEBUG
    org.springframework.web: WARN
    org.hibernate.SQL: DEBUG
